<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Inter for future use -->
    <!-- <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet"> -->
    <link rel="stylesheet" href="styles/settings.css">
    <title>Settings</title>
</head>

<body>
    <nav>
        <!-- <h1 style="align-self: center;margin: 10px 0;">Settings</h1> -->
        <img src="./assets/images/Record-Button-Hover.svg" style="padding: 15px 5px;" alt="">
        <button data-tab="general" class="active">General Settings</button>
        <button data-tab="screen">Select Screen</button>
        <button data-tab="files">File & Folder</button>
        <button data-tab="about">About</button>
    </nav>

    <div id="content">
        <!-- General -->
        <section id="tab-general" class="active">
            <h1>General Settings</h1>
            <hr>
            <label><input type="checkbox" id="alwaysOnTop"> Window always on top</label><br><br>
            <label>Open position:
                <select id="openPos">
                    <option value="top-centre">Top-centre</option>
                    <option value="middle-centre">Centre-centre</option>
                    <option value="bottom-centre">Bottom-centre</option>
                </select>
            </label><br><br>
            <p>Theme: <em>(coming soon)</em></p>
            <p>Fonts: <em>(coming soon)</em></p>
        </section>

        <!-- Screen -->
        <section id="tab-screen" style="position:relative; height:100%;">
            <h1>Select Screen</h1>
            <hr>
            <p>Choose the screen you want to record.</p>
            <div id="screenList"></div>
            <br><br><br><br><br>
            <h2 style="position:absolute; bottom:20px; left:0;">Selected: <span id="screenChosen">None</span>
            </h2>
        </section>

        <!-- Files -->
        <section id="tab-files">
            <h1>File &amp; Folder</h1>
            <hr>
            <label>Save folder: <span id="savePath">(ask every time)</span>
                <button id="chooseFolder">Browse…</button>
            </label><br><br>
            <label>Video format:
                <select id="videoFormat">
                    <option value="webm">WebM (fast)</option>
                    <option value="mp4">MP4 (higher quality)</option>
                </select>
            </label>
        </section>

        <!-- About -->
        <section id="tab-about">
            <h1>About</h1>
            <hr>
            <p>Author: <a href="https://github.com/yourname" target="_blank">yourname</a></p>
            <p>GitHub project: <a href="https://github.com/yourrepo" target="_blank">Star us on GitHub</a></p>
            <p>Donate / Sponsor: <em>(coming soon)</em></p>
            <p>Feedback &amp; bug report forms: <em>(coming soon)</em></p>
        </section>
    </div>

    <footer>
        <button id="resetBtn" style="background:#555">Reset</button>
        <div style="margin-left:auto">
            <button id="closeBtn" style="background:#555">Close</button>
            <button id="saveBtn">Save</button>
        </div>
    </footer>

    <script>
        window.onload = () => {
            const { ipcRenderer } = require('electron');
            const { dialog } = require('@electron/remote');
            let current = {};               // holds prefs in memory

            /* util */
            const $ = sel => document.querySelector(sel);

            /* populate UI from object */
            function fill() {
                $('#alwaysOnTop').checked = current.alwaysOnTop;
                $('#openPos').value = current.openPos;
                $('#savePath').textContent = current.saveFolder || '(ask every time)';
                $('#videoFormat').value = current.videoFormat;
                $('#screenChosen').textContent = current.selectedScreenId || 'None';
            }

            /* ── fetch settings on load ── */
            ipcRenderer.invoke('get-settings').then(s => { current = s; fill(); });

            /* ── navigation: generic handler ── */
            document.querySelectorAll('nav button').forEach(btn => {
                btn.addEventListener('click', async () => {
                    document.querySelector('nav button.active')?.classList.remove('active');
                    document.querySelector('#content section.active')?.classList.remove('active');
                    btn.classList.add('active');
                    $('#tab-' + btn.dataset.tab).classList.add('active');

                    /* If Screen tab activated, request thumbnails */
                    if (btn.dataset.tab === 'screen') {
                        await ipcRenderer.invoke('pick-screen-list');
                    }
                });
            });

            /* ── react to controls ── */
            $('#alwaysOnTop').onchange = e => current.alwaysOnTop = e.target.checked;
            $('#openPos').onchange = e => current.openPos = e.target.value;
            $('#videoFormat').onchange = e => current.videoFormat = e.target.value;

            $('#chooseFolder').onclick = async () => {
                const r = await dialog.showOpenDialog({ properties: ['openDirectory'] });
                if (!r.canceled && r.filePaths[0]) {
                    current.saveFolder = r.filePaths[0];
                    $('#savePath').textContent = current.saveFolder;
                }
            };

            /* receive thumbnail list for Screen tab */
            // ipcRenderer.on('screens', (_, list) => {
            //     const wrap = $('#screenList'); wrap.innerHTML = '';
            //     list.forEach(scr => {
            //         const btn = document.createElement('button');
            //         // btn.style = 'border:none;background:#333;cursor:pointer;color:#D9D9D9;';
            //         btn.style = 'border:none;cursor:pointer;';
            //         btn.innerHTML = `<img src=\"${scr.dataURL}\" width=180><br>${scr.id}`;
            //         btn.onclick = () => {
            //             current.selectedScreenId = scr.id;
            //             $('#screenChosen').textContent = scr.id;
            //             btn.style = 'border:none;font-weight:bold;background:#84B5FF;color:#1e1e1e;pointer:not-not-alllowed';
            //             // btn.style.pointerEvents = 'none';
            //         };
            //         wrap.appendChild(btn);
            //     });
            // });

            /* keep track of which button is selected */
            let currentBtn = null;

            ipcRenderer.on('screens', (_, list) => {
                const wrap = $('#screenList');
                wrap.innerHTML = '';

                list.forEach(scr => {
                    const btn = document.createElement('button');
                    btn.style = 'border:none;cursor:pointer;';
                    btn.innerHTML = `<img src="${scr.dataURL}" width="180"><br>${scr.id}`;

                    /* pre-select based on settings.json */
                    if (scr.id === current.selectedScreenId) {
                        btn.classList.add('selected');
                        currentBtn = btn;
                    }

                    btn.onclick = () => {
                        /* enable previously selected button */
                        if (currentBtn) currentBtn.classList.remove('selected');

                        /* mark new one */
                        btn.classList.add('selected');
                        currentBtn = btn;

                        current.selectedScreenId = scr.id;
                        $('#screenChosen').textContent = scr.id;
                    };

                    wrap.appendChild(btn);
                });
            });

            /* ── footer buttons ── */
            $('#saveBtn').onclick = () => ipcRenderer.invoke('settings-save', current).then(() => window.close());
            // reset button
            $('#resetBtn').onclick = () => {
                ipcRenderer.invoke('settings-reset').then(() => {
                    current = {     /* clear local prefs */
                        alwaysOnTop: false, openPos: 'bottom-centre', saveFolder: null, videoFormat: 'webm', selectedScreenId: null
                    };
                    /* undo any screen highlight immediately */
                    if (currentBtn) { currentBtn.classList.remove('selected'); currentBtn = null; }
                    $('#screenChosen').textContent = 'None';
                    fill();   // refresh the rest of the controls
                });
            };



            $('#closeBtn').onclick = () => window.close();
        };
    </script>
</body>

</html>
